name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production site
        run: pnpm build

      - name: Diagnose generated output
        run: |
          echo "CURRENT DIRECTORY:"
          pwd

          echo "ROOT FILES:"
          ls -la

          echo "OUTPUT DIRECTORY:"
          ls -la .output || true

          echo "PUBLIC OUTPUT:"
          ls -la .output/public || true

          echo "ALL GENERATED HTML FILES:"
          find . -maxdepth 7 -type f -name "index.html" -print

      - name: Prepare SPA fallback
        run: |
          test -f .output/public/index.html
          cp .output/public/index.html .output/public/404.html
          touch .output/public/.nojekyll

      - name: Upload production build
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
